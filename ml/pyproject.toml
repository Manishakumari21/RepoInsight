[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoinsight-ml"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "joblib==1.6.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]


